<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Campus Marketplace{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        nav {
            background: #173b57;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        nav .brand {
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            width: 84%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 22px;
        }

        .product-card,
        .panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .product-card img {
            width: 100%;
            height: 190px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .product-card h3 {
            margin-bottom: 8px;
        }

        .price {
            color: #167447;
            font-size: 20px;
            font-weight: bold;
        }

        .muted {
            color: #777;
        }

        .btn {
            display: inline-block;
            background: #1769aa;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-secondary {
            background: #64748b;
        }

        .btn-danger {
            background: #c0392b;
        }

        .btn-success {
            background: #218838;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font: inherit;
        }

        input[type="checkbox"] {
            width: auto;
        }

        .form-errors {
            color: #c0392b;
            margin-top: 5px;
        }

        .product-image {
            max-width: 100%;
            max-height: 420px;
            object-fit: contain;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            color: #777;
        }

        @media (max-width: 600px) {
            .container {
                width: 92%;
            }

            nav {
                padding: 16px 4%;
                flex-wrap: wrap;
                gap: 12px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a class="brand" href="{% url 'products:product-list' %}">
            Campus Marketplace
        </a>

        <div>
            <a href="{% url 'products:product-list' %}">Products</a>
            <a href="{% url 'products:product-create' %}">Add Product</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        &copy; 2026 Campus Marketplace
    </footer>

</body>
</html>
